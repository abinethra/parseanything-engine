[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parseanything"
version = "1.0.0"
description = "Modular, self-hosted document ingestion engine for finance, legal, and data science workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "ParseAnything Team"}
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent"
]
dependencies = [
    "pydantic>=2.0.0",
    "pymupdf>=1.23.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-docx>=0.8.11",
    "python-pptx>=0.6.21",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "extract-msg>=0.41.0"
]

[project.scripts]
parseanything-api = "parseanything.app:app"

[tool.setuptools.packages.find]
where = ["src"]
